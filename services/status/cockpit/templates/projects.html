<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects · __TITLE__</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/projects.css">
</head>
<body data-refresh="__REFRESH__">
<div class="wrap">
  <header>
    <h1>Projects</h1>
    <div class="tools">
      <span class="msg" id="pushMsg"></span>
      <button type="button" class="btn" id="pushAll" hidden>Push all</button>
      <button type="button" class="btn secondary" id="editBtn">Edit</button>
      <a class="back" href="/">&larr; Cockpit</a>
    </div>
  </header>
  <p class="summary" id="summary">Loading…</p>
  <ul id="list"></ul>
  <div class="edit-bar" id="editBar" hidden>
    <button type="button" class="btn secondary" id="addBtn">+ Add project</button>
    <span style="flex:1"></span>
    <span class="msg" id="msg"></span>
    <button type="button" class="btn secondary" id="cancelBtn">Cancel</button>
    <button type="button" class="btn" id="saveBtn">Save</button>
  </div>
</div>
<script src="/static/common.js"></script>
<script src="/static/projects.js"></script>
</body>
</html>
