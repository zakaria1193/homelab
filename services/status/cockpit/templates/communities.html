<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Communities · __TITLE__</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/communities.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Communities</h1>
    <div class="top-right">
      <span class="muted small" id="updated"></span>
      <a class="back" href="/">&larr; Cockpit</a>
    </div>
  </header>
  <div class="notice" id="notice" hidden></div>

  <section class="card" id="create-card">
    <h2>New community</h2>
    <p class="muted small">Slug, origin and hosts are fixed after creation. The new community starts hidden,
      with every feature off and manual ingestion.</p>
    <form id="create-form" onsubmit="return false">
      <label>slug <input type="text" id="create-slug" placeholder="my-city"></label>
      <label>name <input type="text" id="create-name" maxlength="80" placeholder="My City socials"></label>
      <label>origin <input type="text" id="create-origin" placeholder="https://my-city.pages.dev"></label>
      <label>hosts (comma-separated) <input type="text" id="create-hosts" placeholder="my-city.pages.dev"></label>
      <div class="edit-actions">
        <button class="btn small" id="create-submit">Create community</button>
        <span class="muted small" id="create-status"></span>
      </div>
    </form>
  </section>

  <section id="cards" class="communities-cards"></section>

  <footer class="muted small" id="note"></footer>
</div>
<script src="/static/common.js"></script>
<script src="/static/communities.js"></script>
</body>
</html>
