# Dedicated tmux configuration for homelab status web terminal (xterm.js)
# Automatically applied to all cockpit- spawned terminal sessions.

# Dynamic sizing & window management
set -g window-size latest
set -g default-size 220x60
setw -g aggressive-resize on

# Terminal & color support
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc,xterm*:Tc"

# Mouse support for scrolling and pane selection in browser
set -g mouse on

# History & scrollback
set -g history-limit 50000

# Faster key response (no escape delay in vim)
set -s escape-time 10
set -sg repeat-time 300

# Status bar (minimal/off by default for clean full-screen view)
set -g status off
