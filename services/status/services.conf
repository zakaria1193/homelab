# ------------------------------------------------------------------- Home --- #
[home-assistant]
group = Home
type = http
url = http://%(pi)s:8123/
link = http://%(pi)s:8123
remote = https://hass.zakariafadli.com
alt_links = https://antigravity.google.com|antigravity|agy, https://claude.ai/code|claude|claude
note = runs on the Raspberry Pi (%(pi)s)

# Deliberately `type = shell`, not a Remote Control instance: this mounts the
# Pi's HA config over sshfs for the life of one interactive CLI run and
# auto-unmounts on exit (see the Makefile), which is a terminal session's job,
# not a systemd daemon's. Two entries, one per CLI - both just run
# `make <verb>` in hass-sshfs-bots, which does the mount/unmount itself.
[hass-sshfs-bots (claude)]
group = Home
type = shell
command = make claude
note = mounts HA config from the Pi over sshfs, opens Claude Code, unmounts on exit
dir = services/AI/hass-sshfs-bots

[hass-sshfs-bots (agy)]
group = Home
type = shell
command = make agy
note = same workspace, Antigravity CLI instead
dir = services/AI/hass-sshfs-bots

# ------------------------------------------------------------------ Infra --- #
# The homelab session lives here rather than under AI: it works on this repo,
# so it belongs with the rest of the homelab plumbing.
# Two chips, one homelab workspace, one CLI each - same split as Paperclip's:
# never both consoles on one chip, so each keeps its own obvious default
# action instead of an inert name you have to pick a console on.
#
# This session operates every other entry on the page, so it is lifted out of
# Infra and rendered in the header next to the totals.
[chat (claude)]
group = Infra
type = systemd
unit = claude-rc-ai
pinned = 1
headline = 1
icon = claude
# Not a tunnel route: this is the always-on homelab session this daemon serves,
# reached through claude.ai rather than through cloudflared.
remote = https://claude.ai/code/session_014oYwoRc8sxA36dYizU5tAZ
note = always-on homelab Claude session
# The unit deliberately runs from the repo root; open the shell where its
# Makefile is instead.
dir = services/AI/claudeRcAI

# Same reasoning as paperclip-chat (agy): `agy --remote-control` is one
# whole-machine daemon, not a per-workspace instance, so this rides on the
# same `agy-remote-control` unit `[antigravity-rc]` probes rather than having
# one of its own.
[chat (agy)]
group = Infra
type = systemd-user
unit = agy-remote-control
pinned = 1
# Same box, same "operate the homelab with this" role as chat (claude) - it
# belongs next to it in the header, not filed under Infra as if it were one
# more thing being watched.
headline = 1
icon = antigravity
remote = https://antigravity.google.com
note = same homelab workspace, via the shared Antigravity console
dir = services/AI/antigravityRcAI

[homelab cockpit]
group = Infra
type = systemd
unit = homelab-status
pinned = 1
link = http://%(host)s:8300
remote = https://homelab.zakariafadli.com
note = this cockpit
dir = services/status

[docker]
group = Infra
type = systemd
unit = snap.docker.dockerd.service

[ssh]
group = Infra
type = port
port = 22
logs = journal:ssh.service
note = ssh.zakariafadli.com

[raspberry-pi]
group = Infra
type = port
probe_host = %(pi)s
port = 22
note = sshpi.zakariafadli.com - tunnel + Home Assistant host

[jellyfin-web]
group = Infra
type = http
url = http://127.0.0.1:8096/health
dir = services/media
logs = docker:jellyfin
note = Jellyfin HTTP endpoint

# ------------------------------------------------------------ Maintenance --- #
# The weekly AI upgrade run is a cron job, not a unit, so it is tracked through
# the log it appends to:
#   0 4 * * 0  make -C <repo>/services/AI upgrade >> <repo>/services/AI/upgrade.log 2>&1
# `path` is relative to the repository root. `command` gives this card a shell
# button that opens right next to the log (logfile's `dir` fallback) and types
# itself: `tee -a` both streams the run live in the terminal and appends to the
# same file "logs" tails, so a manual retrigger shows up as "last update run"
# exactly like the cron one does.
[ai-services-upgrade]
group = Maintenance
type = logfile
path = services/AI/upgrade.log
ok_pattern = All AI services upgraded successfully
fail_pattern = Error 2
max_age_hours = 192
note = weekly cron - Sun 04:00 - shell button retriggers it on demand
command = make upgrade 2>&1 | tee -a upgrade.log

[unattended-upgrades]
group = Maintenance
type = systemd
note = OS security updates
