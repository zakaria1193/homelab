# Homelab status dashboard - service inventory.
#
# This page is an OPERATING console first: every group shows an always-visible
# row of the things you actually click (terminals, then the links of whatever is
# up), and folds the per-service diagnostics away behind "logs & shells".
#
# One section per entry. Supported keys:
#   group       Heading the entry is listed under (free text). Config order
#               decides both the group order and the order within a group.
#   type        systemd | systemd-user | systemd-system | docker | http | port
#               | logfile | shell
#               "systemd" auto-detects user vs system scope.
#               "shell" is not a service at all: it is a terminal launcher, so
#               it is never probed and never counted in the totals.
#   unit        systemd unit name          (defaults to the section name)
#   container   docker container name      (defaults to the section name)
#   url         URL probed by type = http
#   probe_host  host probed by type = port (default 127.0.0.1)
#   port        TCP port probed by type = port
#   link        LAN URL for the service's own web UI
#   remote      Public (Cloudflare tunnel) URL for the same UI. The page leads
#               with whichever of the two matches how you reached it and keeps
#               the other one click away.
#   pinned      1 = always show in the quick row, even when the service is down
#   note        Optional short text shown on the card
#   icon        Glyph shown before the name in the quick row: `terminal` or
#               `claude`. Launchers default to `terminal`; set `claude` on the
#               Remote Control sessions so a Claude tab is never mistaken for a
#               local shell.
#   command     Typed into the shell when it opens (required for type = shell,
#               optional elsewhere; defaults to `make help` when the directory
#               holds a Makefile). Setting it on a normal service also puts a
#               shell button on that service's chip, which is how a web session
#               and its local terminal share one chip.
#   dir         Directory the browser shell opens in. Defaults to the unit's
#               systemd WorkingDirectory, else the log file's directory, else
#               the repo root. For type = docker the shell execs inside the
#               container and `dir` becomes a SECOND "compose" shell on the
#               host, opened where that container's docker-compose.yml lives.
#
# %(host)s below expands to the DEFAULT host, overridable with STATUS_LINK_HOST.

[DEFAULT]
host = 192.168.1.10
pi = 192.168.1.11

# --------------------------------------------------------------------- AI --- #
# The Paperclip MCP client, one click away in the workspace the alias cds into.
# Its Claude counterpart is not a separate launcher: it is the shell button on
# the claude-rc-paperclip chip below, which serves the same workspace.
[paperclip (agy)]
group = AI
type = shell
command = agy_paperclip
note = Paperclip MCP client - agy
dir = services/AI/paperclipAI

[paperclip-ai]
group = AI
type = systemd
pinned = 1
link = http://%(host)s:3100
remote = https://paperclip.zakariafadli.com
# Pinned: this unit's WorkingDirectory is $HOME, not the service directory.
dir = services/AI/paperclipAI

[paperclip-mcp]
group = AI
type = systemd
pinned = 1
remote = https://paperclip-mcp.zakariafadli.com
# Binds 127.0.0.1 only, so there is no LAN link to offer - reach it through the
# tunnel (whose origin is the Pi, not this host) or over SSH.
note = MCP server on 127.0.0.1:9011
dir = services/AI/paperclipAI

[hermes-ai]
group = AI
type = systemd
link = http://%(host)s:8100
remote = https://hermes.zakariafadli.com
dir = services/AI/hermesAI

[openhands-ai]
group = AI
type = systemd
link = http://%(host)s:3030
remote = https://ai.zakariafadli.com
dir = services/AI/openhandsAI

[ai-job-search]
group = AI
type = systemd
link = http://%(host)s:8200
remote = https://chloejobs.zakariafadli.com
# The Makefile lives in daemon/, one level below the unit's WorkingDirectory.
dir = services/AI/ai-job-search/daemon

[acpx-ai]
group = AI
type = systemd
dir = services/AI/acpxAI

[arr-mcp-backend]
group = AI
type = systemd
note = SSE MCP on :10938
# The unit runs inside the arr-mcp submodule; the Makefile is a level up.
dir = services/AI/arrMcpAI

# Second instance of the same service: one Remote Control process serves one
# directory, so the Paperclip MCP workspace needs its own. Started with
# `make start INSTANCE=paperclip`.
[claude-rc-paperclip]
group = AI
type = systemd
pinned = 1
unit = claude-rc-ai-paperclip
icon = claude
remote = https://claude.ai/code
# One chip, two front-ends onto the same workspace: the name opens the web
# session, the shell button runs Claude locally in it. `command` is what puts
# that button there.
command = claude_paperclip
note = always-on Paperclip workspace session
dir = services/AI/paperclipAI

