# Homelab status dashboard - service inventory.
#
# One section per monitored service. Supported keys:
#   group       Heading the card is listed under (free text).
#   type        systemd | systemd-user | systemd-system | docker | http | port
#               "systemd" auto-detects user vs system scope.
#   unit        systemd unit name          (defaults to the section name)
#   container   docker container name      (defaults to the section name)
#   url         URL probed by type = http
#   probe_host  host probed by type = port (default 127.0.0.1)
#   port        TCP port probed by type = port
#   link        Optional URL the card title links to (the service's own web UI)
#   note        Optional short text shown under the card
#
# %(host)s below expands to the DEFAULT host, overridable with STATUS_LINK_HOST.

[DEFAULT]
host = 192.168.1.10

# --------------------------------------------------------------------- AI --- #
[paperclip-ai]
group = AI
type = systemd
link = http://%(host)s:3100

[paperclip-mcp]
group = AI
type = systemd
note = MCP server on :9011

[hermes-ai]
group = AI
type = systemd
link = http://%(host)s:8100

[acpx-ai]
group = AI
type = systemd

[openhands-ai]
group = AI
type = systemd
link = http://%(host)s:3030

[ai-job-search]
group = AI
type = systemd
link = http://%(host)s:8200

[arr-mcp-backend]
group = AI
type = systemd
note = SSE MCP on :10938

[claude-rc-ai]
group = AI
type = systemd

# ------------------------------------------------------------------ Media --- #
[jellyfin]
group = Media
type = docker
link = http://%(host)s:8096

[sonarr]
group = Media
type = docker
link = http://%(host)s:8989

[radarr]
group = Media
type = docker
link = http://%(host)s:7878

[readarr]
group = Media
type = docker
link = http://%(host)s:8787

[prowlarr]
group = Media
type = docker
link = http://%(host)s:9696

[transmission]
group = Media
type = docker
link = http://%(host)s:9091

# --------------------------------------------------------------- Karakeep --- #
[karakeep]
group = Karakeep
type = docker
container = karakeep-web-1
link = http://%(host)s:3000

[karakeep-meilisearch]
group = Karakeep
type = docker
container = karakeep-meilisearch-1

[karakeep-chrome]
group = Karakeep
type = docker
container = karakeep-chrome-1

# ------------------------------------------------------------------ Infra --- #
[docker]
group = Infra
type = systemd
unit = snap.docker.dockerd.service

[ssh]
group = Infra
type = port
port = 22
logs = journal:ssh.service

[jellyfin-web]
group = Infra
type = http
url = http://127.0.0.1:8096/health
logs = docker:jellyfin
note = Jellyfin HTTP endpoint

[homelab-status]
group = Infra
type = systemd
link = http://%(host)s:8300
note = this dashboard

# ------------------------------------------------------------ Maintenance --- #
# The weekly AI upgrade run is a cron job, not a unit, so it is tracked through
# the log it appends to:
#   0 4 * * 0  make -C <repo>/services/AI upgrade >> <repo>/services/AI/upgrade.log 2>&1
# `path` is relative to the repository root.
[ai-services-upgrade]
group = Maintenance
type = logfile
path = services/AI/upgrade.log
ok_pattern = All AI services upgraded successfully
fail_pattern = Error 2
max_age_hours = 192
note = weekly cron - Sun 04:00

[unattended-upgrades]
group = Maintenance
type = systemd
note = OS security updates
