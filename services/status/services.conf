[jellyfin]
group = Media
type = docker
link = http://%(host)s:8096
remote = https://media.zakariafadli.com
dir = services/media

[sonarr]
group = Media
type = docker
link = http://%(host)s:8989
remote = https://sonarr.zakariafadli.com
dir = services/media

[radarr]
group = Media
type = docker
link = http://%(host)s:7878
remote = https://radarr.zakariafadli.com
dir = services/media

[readarr]
group = Media
type = docker
link = http://%(host)s:8787
remote = https://readarr.zakariafadli.com
dir = services/media

[prowlarr]
group = Media
type = docker
link = http://%(host)s:9696
remote = https://prowlarr.zakariafadli.com
dir = services/media

[transmission]
group = Media
type = docker
link = http://%(host)s:9091
note = LAN only - no tunnel route
dir = services/media

# --------------------------------------------------------------- Karakeep --- #
[karakeep]
group = Karakeep
type = docker
container = karakeep-web-1
link = http://%(host)s:3000
remote = https://keep.zakariafadli.com
dir = services/karakeep

[karakeep-meilisearch]
group = Karakeep
type = docker
container = karakeep-meilisearch-1
dir = services/karakeep

[karakeep-chrome]
group = Karakeep
type = docker
container = karakeep-chrome-1
dir = services/karakeep

# ------------------------------------------------------------------- Home --- #
[home-assistant]
group = Home
type = http
url = http://%(pi)s:8123/
link = http://%(pi)s:8123
remote = https://hass.zakariafadli.com
note = runs on the Raspberry Pi (%(pi)s)

# ------------------------------------------------------------------ Infra --- #
# The homelab session lives here rather than under AI: it works on this repo,
# so it belongs with the rest of the homelab plumbing.
[homelab claude agent]
group = Infra
type = systemd
unit = claude-rc-ai
pinned = 1
# This session operates every other entry on the page, so it is lifted out of
# Infra and rendered in the header next to the totals.
headline = 1
icon = claude
# Not a tunnel route: this is the always-on homelab session this daemon serves,
# reached through claude.ai rather than through cloudflared.
remote = https://claude.ai/code/session_014oYwoRc8sxA36dYizU5tAZ
# Same box, other console.
alt_link = https://antigravity.google.com
alt_icon = antigravity
alt_label = agy
note = always-on homelab Claude session
# The unit deliberately runs from the repo root; open the shell where its
# Makefile is instead.
dir = services/AI/claudeRcAI

[homelab cockpit]
group = Infra
type = systemd
unit = homelab-status
pinned = 1
link = http://%(host)s:8300
remote = https://homelab.zakariafadli.com
note = this cockpit
dir = services/status

[docker]
group = Infra
type = systemd
unit = snap.docker.dockerd.service

[ssh]
group = Infra
type = port
port = 22
logs = journal:ssh.service
note = ssh.zakariafadli.com

[raspberry-pi]
group = Infra
type = port
probe_host = %(pi)s
port = 22
note = sshpi.zakariafadli.com - tunnel + Home Assistant host

[jellyfin-web]
group = Infra
type = http
url = http://127.0.0.1:8096/health
dir = services/media
logs = docker:jellyfin
note = Jellyfin HTTP endpoint

# ------------------------------------------------------------ Maintenance --- #
# The weekly AI upgrade run is a cron job, not a unit, so it is tracked through
# the log it appends to:
#   0 4 * * 0  make -C <repo>/services/AI upgrade >> <repo>/services/AI/upgrade.log 2>&1
# `path` is relative to the repository root.
[ai-services-upgrade]
group = Maintenance
type = logfile
path = services/AI/upgrade.log
ok_pattern = All AI services upgraded successfully
fail_pattern = Error 2
max_age_hours = 192
note = weekly cron - Sun 04:00

[unattended-upgrades]
group = Maintenance
type = systemd
note = OS security updates
