# Homelab cockpit - service inventory.
#
# This page is an OPERATING console first: every group shows an always-visible
# row of the things you actually click (terminals, then the links of whatever is
# up), and folds the per-service diagnostics away behind "logs & shells".
#
# One section per entry. Supported keys:
#   group       Heading the entry is listed under (free text). Config order
#               decides both the group order and the order within a group.
#   type        systemd | systemd-user | systemd-system | docker | http | port
#               | logfile | shell
#               "systemd" auto-detects user vs system scope.
#               "shell" is not a service at all: it is a terminal launcher, so
#               it is never probed and never counted in the totals.
#   unit        systemd unit name          (defaults to the section name)
#   container   docker container name      (defaults to the section name)
#   url         URL probed by type = http
#   probe_host  host probed by type = port (default 127.0.0.1)
#   port        TCP port probed by type = port
#   link        LAN URL for the service's own web UI
#   remote      Public (Cloudflare tunnel) URL for the same UI. The page leads
#               with whichever of the two matches how you reached it and keeps
#               the other one click away.
#   endpoint    An address that is NOT a web UI - an MCP server, a socket - so
#               it is rendered as inert text with a copy button instead of a
#               link. Use it instead of `link`/`remote` when the thing is
#               something an agent dials, not something you open.
#   alt_link    A second, named front-end onto the same thing, shown as an
#   alt_label   extra button next to the chip's own primary link - the name
#   alt_icon    stays the default action, this is just another way in.
#               `alt_links` (plural) is the same idea for more than one extra
#               front-end: `href|icon|label` triples, comma-separated. Two
#               consoles onto the SAME session (e.g. Claude and Antigravity on
#               one workspace) get two separate chips instead, each with its
#               own default action - see `[paperclip-chat (claude)]` and
#               `[paperclip-chat (agy)]` below - rather than merging them onto
#               one chip with no obvious default.
#   pinned      1 = always show in the quick row, even when the service is down
#   headline    1 = render in the page header next to the totals instead of in
#               a group. For entries that operate the homelab rather than sit
#               in it; keep this to one or two.
#   note        Optional short text shown on the card
#   icon        Logo shown before the name. Defaults to the section name (so
#               `[jellyfin]` gets the Jellyfin mark for free) and only needs
#               setting when the name does not match a known logo - `terminal`,
#               `claude`, `bridge`, `briefcase`, `upgrade`, `logfile` are the
#               generic ones. Launchers default to `terminal`; `claude` on the
#               Remote Control sessions keeps a Claude tab from reading as a
#               local shell. Anything pointing at %(pi)s is additionally badged
#               with the Raspberry Pi berry, so no key is needed for that.
#   command     Typed into the shell when it opens (required for type = shell,
#               optional elsewhere; defaults to `make help` when the directory
#               holds a Makefile). Setting it on a normal service also puts a
#               shell button on that service's chip, which is how a web session
#               and its local terminal share one chip.
#   dir         Directory the browser shell opens in. Defaults to the unit's
#               systemd WorkingDirectory, else the log file's directory, else
#               the repo root. For type = docker the shell execs inside the
#               container and `dir` becomes a SECOND "compose" shell on the
#               host, opened where that container's docker-compose.yml lives.
#
# %(host)s below expands to the DEFAULT host, overridable with STATUS_LINK_HOST.

[DEFAULT]
host = 192.168.1.10
pi = 192.168.1.11

# --------------------------------------------------------------------- AI --- #
[paperclip-ai]
group = AI
type = systemd
pinned = 1
link = http://%(host)s:3100
remote = https://paperclip.zakariafadli.com
# Pinned: this unit's WorkingDirectory is $HOME, not the service directory.
dir = services/AI/paperclipAI

[hermes-ai]
group = AI
type = systemd
link = http://%(host)s:8100
remote = https://hermes.zakariafadli.com
dir = services/AI/hermesAI

[openhands-ai]
group = AI
type = systemd
link = http://%(host)s:3030
remote = https://ai.zakariafadli.com
dir = services/AI/openhandsAI

[ai-job-search]
group = AI
type = systemd
link = http://%(host)s:8200
remote = https://chloejobs.zakariafadli.com
# The Makefile lives in daemon/, one level below the unit's WorkingDirectory.
dir = services/AI/ai-job-search/daemon

[acpx-ai]
group = AI
type = systemd
dir = services/AI/acpxAI

# Two chips, one Paperclip workspace, one CLI each - deliberately NOT merged
# into one `chat` chip: each keeps its own obvious default action (the Remote
# Control web session) with its own terminal as the side button, rather than
# making the name inert and forcing a pick between two small icons.
#
# Second instance of the same service: one Remote Control process serves one
# directory, so the Paperclip MCP workspace needs its own. Started with
# `make start INSTANCE=paperclip`.
[paperclip-chat (claude)]
group = AI
type = systemd
pinned = 1
unit = claude-rc-ai-paperclip
icon = claude
remote = https://claude.ai/code
# Default button opens the web session; the shell button (from `command`) runs
# Claude locally in the same workspace.
command = claude_paperclip
note = always-on Paperclip workspace session
dir = services/AI/paperclipAI

# `agy --remote-control` exposes the whole MACHINE, not one workspace, so there
# is no per-instance unit to start here - this chip rides on the same
# `agy-remote-control` daemon `[antigravity-rc]` below probes, and only adds
# the workspace-scoped console URL and a Paperclip-scoped terminal button.
[paperclip-chat (agy)]
group = AI
type = systemd-user
pinned = 1
unit = agy-remote-control
icon = antigravity
remote = https://antigravity.google.com
command = agy_paperclip
note = same Paperclip workspace, via the shared Antigravity console
dir = services/AI/paperclipAI

# Antigravity's answer to claude-rc: the whole-box console both chips above
# point their default button at. There is exactly one of these.
[antigravity-rc]
group = AI
type = systemd-user
pinned = 1
unit = agy-remote-control
icon = antigravity
link = http://192.168.1.10:4400
remote = https://agy.zakariafadli.com
note = always-on Antigravity session (whole box)
dir = services/AI/antigravityRcAI

# --------------------------------------------------------------------- MCP --- #
# Every MCP server the homelab speaks lives here rather than under AI: they are
# one class of thing - a protocol endpoint an agent dials - and you check them
# together when a tool call stops answering.
[paperclip-mcp]
group = MCP
type = systemd
pinned = 1
# Deliberately `endpoint`, not `remote`: this hostname is public only so that
# web-based agents can dial the MCP server through the tunnel. There is no page
# behind it, so the chip is inert and offers the address for copying instead.
endpoint = https://paperclip-mcp.zakariafadli.com
# Binds 127.0.0.1 only, so there is no LAN link to offer - reach it through the
# tunnel (whose origin is the Pi, not this host) or over SSH.
note = MCP server on 127.0.0.1:9011
dir = services/AI/paperclipAI

[arr-mcp-backend]
group = MCP
type = systemd
endpoint = http://127.0.0.1:10938/mcp
note = SSE MCP on :10938
# The unit runs inside the arr-mcp submodule; the Makefile is a level up.
dir = services/AI/arrMcpAI

[playwright-mcp]
group = MCP
type = systemd
endpoint = http://%(host)s:9012/mcp
remote = https://playwright.zakariafadli.com/mcp
note = MCP server on :9012
dir = services/AI/playwrightMcpAI

