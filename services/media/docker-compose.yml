# Every image is pinned to an exact version tag plus its digest (2026-11-14):
# `compose pull` cannot move them. To upgrade one, change its tag and digest
# here on purpose (see README.md -> Upgrading).
services:

  jellyfin:
    image: jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    container_name: jellyfin
    network_mode: host

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      # Optional - alternative address used for autodiscovery
      JELLYFIN_PublishedServerUrl: http://media.zakariafadli.com/

    volumes:
      - ./jellyfin:/config
      - ./jellyfin_cache:/cache
      - ${TVDIR}:/tv
      - ${MOVIESDIR}:/movies
      - ${BOOKSDIR}:/books
      - ${BOOKSDIR_WORK_PDFS}:/books/work_pdfs

    restart: unless-stopped

    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - "host.docker.internal:host-gateway"

  sonarr:
    container_name: sonarr
    image: linuxserver/sonarr:4.0.20.3014-ls4@sha256:673dc4609a5672bc8e46069c86ffcea283a86b48d34a6c93d8da8c24a1b87571
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./sonarr:/config
      - ${DLDIR}/complete:/downloads/complete
      - ${TVDIR}:/tv
      - /etc/localtime:/etc/localtime:ro

  radarr:
    container_name: radarr
    image: linuxserver/radarr:6.4.4.10685-ls326@sha256:51a9ac2a9eb47afc833541e5fd6c11b86eb9f810694c22fa2429e3078e9194b2
    restart: unless-stopped
    ports:
      - "7878:7878"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./radarr:/config
      - ${DLDIR}/complete:/downloads/complete
      - ${MOVIESDIR}:/movies
      - /etc/localtime:/etc/localtime:ro

  # Ebooks and audiobooks in one instance; replaced the retired Readarr.
  chaptarr:
    image: chaptarr/chaptarr:0.9.965@sha256:bb00d67cbe1485d1cd61ef178362a29b42aa08f86b290841aab4b115ad2647a6
    container_name: chaptarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: "002"
      TZ: ${TZ}
    volumes:
      - ./chaptarr:/config
      - ${DLDIR}/complete:/downloads/complete
      - ${BOOKSDIR}:/books
      - ${BOOKSDIR_WORK_PDFS}:/books/written books
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8789:8789"
    restart: unless-stopped

  transmission:
    image: linuxserver/transmission:4.1.4-r0-ls369@sha256:aaf349cd859ca9d5f34f394c56b8097c267a513283698adc4d07ee61d7cb1a85
    container_name: transmission
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      # TRANSMISSION_WEB_HOME: /combustion-release/  # optional
    volumes:
      - ./tansmission:/config
      - ${DLDIR}:/downloads
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.7.0.5723-ls167@sha256:431d7efebcef466e56adaa40a7a2fa2b0e85159a037b8bf465eaadbf0cf5bedf
    container_name: prowlarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./prowlarr:/config
    # The ISP resolver (192.168.1.254) answers 127.0.0.1 for most torrent
    # sites, so the indexer side resolves through Cloudflare instead.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    ports:
      - "9696:9696"
    restart: unless-stopped

  # Solves Cloudflare challenges for Prowlarr; indexers tagged "flaresolverr"
  # (1337x, kickass, ...) go through it at http://flaresolverr:8191.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    container_name: flaresolverr
    environment:
      LOG_LEVEL: info
      TZ: ${TZ}
    # The ISP resolver (192.168.1.254) answers 127.0.0.1 for most torrent
    # sites, so the indexer side resolves through Cloudflare instead.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    ports:
      - "8191:8191"
    restart: unless-stopped
