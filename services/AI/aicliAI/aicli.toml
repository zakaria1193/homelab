# aicli's one config file. Everything a caller needs to know about the
# `claude` and `agy` CLIs - binary paths, model tiers, standard flags - lives
# here. See ../../../AGENTS.md and ticket homelab-0013 for the why.

usage_timeout = 30

[claude]
bin = "~/.local/bin/claude"
args = []
model_flag = "--model"
effort_flag = "--effort"

[claude.tiers]
low = "claude-haiku-5-5"
default = "claude-sonnet-5"
deep = "claude-opus-5-5"

[agy]
bin = "~/.local/bin/agy"
args = []
model_flag = "--model"
effort_flag = "--effort"

[agy.tiers]
low = "gemini-3.8-flash-low"
default = "gemini-3.8-flash-high"
deep = "gemini-3.8-flash-high"

# --- Workload Classes & Routing ----------------------------------------------
# Callers can pass `--class <name>` and optional `--client <id>` instead of
# hardcoding tools and models. The default routing here can be customized
# live from the Cockpit UI (/ai-routes), which writes overrides to routes.json.

[classes.maintenance]
description = "Repository maintenance, CI fixes, security dependency updates"
frequency = "Daily/Weekly background batch"
tool = "agy"
tier = "low"

[classes.deep-spec]
description = "Complex architecture, multi-file specs, and deep PR reviews"
frequency = "Moderate (ticket creation & review)"
tool = "claude"
tier = "deep"

[classes.standard-dev]
description = "Standard code implementation, ticket subtask execution"
frequency = "High burst during active work"
tool = "claude"
tier = "default"

[classes.managerial-audit]
description = "Cross-project status auditing, watchdog, and scheduled scrum reports"
frequency = "4 times / day (07:30, 12:00, 17:00, 22:00)"
tool = "agy"
tier = "low"

[classes.lightweight-task]
description = "High-throughput data extraction, job scraping, metadata tagging"
frequency = "Continuous / On-demand"
tool = "agy"
tier = "low"

[classes.interactive-shell]
description = "Direct interactive human terminal sessions"
frequency = "On-demand by user"
tool = "claude"
tier = "default"

