# aicli's one config file. Everything a caller needs to know about the
# `claude` and `agy` CLIs - binary paths, model tiers, standard flags - plus
# the default workload classes, client rows and OptiPlex project list, lives
# here. `git pull` is the one thing that ever changes this file; the cockpit's
# AI Routes tab and `aicli route` edit a separate, untracked state file
# (~/.local/state/aicli/routes.json) that overrides these defaults field by
# field - see ../../../AGENTS.md and tickets homelab-0013/homelab-0019.

usage_timeout = 30

# Projects that run on the OptiPlex AND call aicli - each one checked against
# its checkout and this machine (a running unit, and aicli in its code), not
# assumed. A project deployed elsewhere (farah, salsa-social, zakariafadli.com)
# or one that never calls aicli does not belong here, whatever CLI pjm's agents
# use to work on it. The cockpit's Projects panel registers/enables/disables
# these live in the untracked state file.
optiplex_projects = [
  "homelab",
  "pjm",
  "social-helper",
]

[claude]
bin = "~/.local/bin/claude"
args = []
model_flag = "--model"
effort_flag = "--effort"

[claude.tiers]
low = "claude-haiku-5-5"
default = "claude-sonnet-5"
deep = "claude-opus-5-5"

[agy]
bin = "~/.local/bin/agy"
args = []
model_flag = "--model"
effort_flag = "--effort"
# Each agy model names its effort, and agy rejects an --effort that differs:
# when aicli adds the tier's model it drops the effort, so the tier decides.
model_sets_effort = true
# agy settings file whose `trustedWorkspaces` aicli extends so agy never asks "trust this folder".
trust_file = "~/.gemini/antigravity-cli/settings.json"
# agy's global skills folder (agy reads ~/.gemini/config/skills/<name>/SKILL.md); aicli keeps
# its skills there as aicli-<name>. Set explicitly: the fallback (next to trust_file) is not where agy looks.
skills_dir = "~/.gemini/config/skills"

[agy.tiers]
low = "gemini-3.8-flash-low"
default = "gemini-4-hydrogen-medium"
deep = "gemini-4-hydrogen-high"

# --- Fallback -----------------------------------------------------------------
# Each workload class can define its own `fallback` step(s) (or disable fallback).
# Once the primary plan's five-hour or weekly bar reaches `at` percent, `aicli`
# moves runs of that class to its configured fallback if that fallback's quota
# group still has room. Before falling back, `aicli` relies on the reset timer
# (`next_ok_at`) and retests the primary choice once the reset window arrives.

[fallback]
at = 97
# Reserve 20% quota for critical background maintenance & audits. Standard dev yields at 80%.
reserve = 20

# --- Workload Classes & Routing ----------------------------------------------
# Callers pass `--class <name>` and optional `--client <id>` instead of
# hardcoding tools and models. These are the defaults; the cockpit's AI Routes
# tab (/ai-routes) and `aicli route` change them live by writing only the
# changed fields to the untracked state file, never to this file.

[classes.maintenance]
description = "Repository maintenance, CI fixes, security dependency updates"
frequency = "Daily/Weekly background batch"
tool = "agy"
tier = "low"
priority = "critical"
fallback = { tool = "claude", model = "claude-haiku-5-5" }

[classes.deep-spec]
description = "Complex architecture, multi-file specs, and deep PR reviews"
frequency = "Moderate (ticket creation & review)"
tool = "claude"
tier = "deep"
effort = "high"
fallback = [
    { tool = "agy", model = "gemini-4-argon-high", group = "Gemini 4 Argon" },
    { tool = "agy", model = "gemini-4-neon-high", group = "Gemini Models" },
]

[classes.standard-dev]
description = "Standard code implementation, ticket subtask execution"
frequency = "High burst during active work"
tool = "agy"
tier = "default"
model = "gemini-4-hydrogen-medium"
fallback = { tool = "claude", model = "claude-sonnet-5", effort = "medium" }

[classes.managerial-audit]
description = "Cross-project status auditing, watchdog, and scheduled scrum reports"
frequency = "4 times / day (07:30, 12:00, 17:00, 22:00)"
tool = "agy"
tier = "low"
priority = "critical"
fallback = { tool = "claude", model = "claude-haiku-5-5" }

[classes.brainstorm]
description = "Divergent idea generation: exploring an opportunity into angles and ideas"
frequency = "On-demand, a few calls a day"
tool = "agy"
tier = "deep"
model = "gemini-4-hydrogen-high"
fallback = { tool = "claude", model = "claude-sonnet-5", effort = "medium" }

[classes.conversation]
description = "Talking to a project agent (pjm Chief of staff, Tech lead): quick, turn by turn"
frequency = "On-demand, interactive"
tool = "claude"
tier = "default"
effort = "medium"
fallback = [
    { tool = "agy", model = "gemini-4-argon-medium", group = "Gemini 4 Argon" },
    { tool = "agy", model = "gemini-4-hydrogen-medium", group = "Gemini Models" },
]

[classes.conversation-deep]
description = "Talking to a project agent that must think and push back (pjm Product lead)"
frequency = "On-demand, interactive"
tool = "claude"
tier = "deep"
effort = "high"
fallback = [
    { tool = "agy", model = "gemini-4-argon-high", group = "Gemini 4 Argon" },
    { tool = "agy", model = "gemini-4-neon-high", group = "Gemini Models" },
]

[classes.lightweight-task]
description = "High-throughput data extraction, job scraping, metadata tagging"
frequency = "Continuous / On-demand"
tool = "agy"
tier = "low"
fallback = { tool = "claude", model = "claude-haiku-5-5" }

[classes.career-assistant]
description = "Interactive career assistant answering questions and guiding users"
frequency = "On-demand, interactive"
tool = "agy"
model = "gemini-4-hydrogen-low"
fallback = { tool = "claude", model = "claude-haiku-5-5" }

[classes.career-coach]
description = "Deep career coaching, CV/cover letter tailoring, and fit scoring"
frequency = "Daily / On-demand high-tier runs"
tool = "agy"
tier = "deep"
fallback = { tool = "claude", model = "claude-sonnet-5", effort = "medium" }

[classes.code-review]
description = "Fresh-context review of a ticket's diff against its spec and plan (pjm auto-review)"
frequency = "Once per ticket after execute, plus fix rounds"
tool = "agy"
tier = "default"
model = "gemini-4-hydrogen-medium"
fallback = { tool = "claude", model = "claude-sonnet-5", effort = "medium" }

[classes.deploy-engineer]
description = "Deploying a finished ticket and checking it live (pjm deploy step); doubts the plan and thinks for itself"
frequency = "A few runs a day, after CI green"
tool = "agy"
tier = "deep"
model = "gemini-4-hydrogen-high"
fallback = { tool = "claude", model = "claude-sonnet-5", effort = "medium" }

[classes.interactive-shell]
description = "Direct interactive human terminal sessions"
frequency = "On-demand by user"
tool = "claude"
tier = "default"
fallback = { tool = "agy", model = "gemini-3.8-flash-medium", group = "Gemini Models" }

# Browser-authenticated sessions needing Claude in Chrome (Cloudflare, Resend, external dashboards).
# No fallback to agy: only Claude Code supports --chrome.
[classes.google-chrome-handler]
description = "Browser-authenticated tasks requiring Claude in Chrome (logged-in dashboard sessions)"
frequency = "On-demand, owner-approved restart from pjm"
tool = "claude"
tier = "default"
effort = "medium"

[classes.aiagent-maintenance]
description = "Maintaining an app's own AI agent: learning lasting instructions from chats and consolidating them"
frequency = "A few rounds a day, one hour after chat activity stops"
tool = "agy"
tier = "deep"
model = "gemini-4-neon-high"
fallback = { tool = "claude", model = "claude-opus-5-5", effort = "high" }

# --- Client overrides ---------------------------------------------------------
# A client names the caller; it can pin a class and/or override that class's
# route. A longer dotted id also matches a shorter one (see aicli's README).

[clients."pjm:auto-execute"]
class = "standard-dev"
description = "PJM ticket code implementation & test resolution"
frequency = "High burst during active dev"

[clients."pjm:auto-spec"]
class = "deep-spec"
description = "PJM ticket spec generation & architecture design"
frequency = "Moderate (ticket creation)"

[clients."pjm:auto-review"]
class = "deep-spec"
description = "PJM automated code review & PR verification"
frequency = "Moderate (review rounds)"

[clients."pjm:maintainer:routine"]
class = "maintenance"
description = "PJM repo maintainer routine health checks, CI fixes & dependencies"
frequency = "Daily/weekly per project"

[clients."pjm:maintainer:deep"]
class = "standard-dev"
description = "PJM repo maintainer deep architectural reviews & refactoring"
frequency = "Every 4 done tickets"

[clients."pjm:scrum-master"]
class = "managerial-audit"
description = "PJM Scrum Master periodic multi-project status audits"
frequency = "4 times / day (07:30, 12:00, 17:00, 22:00)"

[clients."homelab:auto-heal"]
class = "maintenance"
description = "Homelab post-upgrade autonomous service repair & container recovery"
frequency = "Triggered on upgrade failures"

[clients."karakeep:tagger"]
class = "lightweight-task"
description = "Karakeep bookmark AI auto-tagging, categorisation & summarisation"
frequency = "On bookmark creation"

[clients."ai-job-search:tailor"]
class = "lightweight-task"
description = "AI Job Search resume tailoring, keyword extraction & portal matching"
frequency = "On-demand batch runs"

[clients."cockpit:terminal"]
class = "interactive-shell"
description = "Interactive operator terminal sessions launched via Cockpit"
frequency = "Interactive on-demand"

[clients."ai-job-search:jobs"]
class = "lightweight-task"

[clients."ai-job-search:masters"]
class = "lightweight-task"

[clients."ai-job-search:temp"]
class = "lightweight-task"

[clients."ai-job-search:paths"]
class = "lightweight-task"

[clients."ai-job-search:certs"]
class = "lightweight-task"

[clients."ai-job-search:freelance"]
class = "lightweight-task"

[clients."ai-job-search:daily"]
class = "career-coach"

[clients."ai-job-search:home"]
class = "career-assistant"
description = "AI Job Search front-page interactive career assistant"
frequency = "On-demand, interactive"

[clients."ai-job-search:auto-learn"]
class = "aiagent-maintenance"
description = "AI Job Search auto-learning of CV/cover-letter instructions from tailor chats, plus their consolidation"
frequency = "Debounced, one hour after the last tailor-chat message"

[clients."pjm:product"]
class = "conversation-deep"
description = "PJM Product lead conversations (every project, Slack and voice)"
frequency = "On-demand, interactive"

[clients."pjm:stems"]
class = "brainstorm"
description = "PJM idea-stem brainstorm"
frequency = "On-demand, a few calls a day"

# The pjm deploy step (auto-deploy, pjm-0032) runs as the deploy engineer, on Opus for now
# (Zak, 2026-11-18). No fallback: a deploy waits for Claude rather than moving to another model.
# Mode auto and the playwright MCP are set by the pjm workflow step, not here.
[clients."pjm:deploy"]
class = "deploy-engineer"

[clients."pjm:google-chrome-handler"]
class = "google-chrome-handler"
description = "PJM owner-approved restart with Claude in Chrome (logged-in browser sessions)"
frequency = "On-demand, owner-approved"

[clients."aicli:auto-reauth-agy"]
class = "google-chrome-handler"
description = "Automatic AGY OAuth re-authentication using Claude in Chrome (never uses agy)"
frequency = "On AGY login expiry"
