# aicli's one config file. Everything a caller needs to know about the
# `claude` and `agy` CLIs - binary paths, model tiers, standard flags - lives
# here. See ../../../AGENTS.md and ticket homelab-0013 for the why.

usage_timeout = 30

[claude]
bin = "~/.local/bin/claude"
args = []
model_flag = "--model"
effort_flag = "--effort"

[claude.tiers]
low = "claude-haiku-5-5"
default = "claude-sonnet-5"
deep = "claude-opus-5-5"

[agy]
bin = "~/.local/bin/agy"
args = []
model_flag = "--model"
effort_flag = "--effort"

[agy.tiers]
low = "gemini-3.8-flash-low"
default = "gemini-3.8-flash-high"
deep = "gemini-3.8-flash-high"
